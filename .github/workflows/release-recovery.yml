name: Release Recovery

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Immutable release tag to recover (vMAJOR.MINOR.PATCH)
        required: true
        type: string

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

env:
  IMAGE_GHCR: ghcr.io/ploos-as/osint-tools
  IMAGE_DOCKERHUB: ploos1/osint-tools

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate immutable release tag
        id: release
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Recovery tag must be vMAJOR.MINOR.PATCH: $TAG" >&2
            exit 1
          fi
          git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          source_sha="$(git rev-list -n1 "$TAG")"
          version="${TAG#v}"
          project_version="$(git show "${TAG}:pyproject.toml" | python -c 'import sys,tomllib; print(tomllib.loads(sys.stdin.read())["project"]["version"])')"
          test "$version" = "$project_version" || {
            echo "Tag version $version != tagged pyproject version $project_version" >&2
            exit 1
          }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Verify existing published manifests and digest equality
        id: verify
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          inspect_with_retry() {
            local image="$1"
            local inspect=""
            local attempt
            for attempt in $(seq 1 12); do
              if inspect="$(docker buildx imagetools inspect "$image" 2>&1)"; then
                if grep -q 'Platform:.*linux/amd64' <<<"$inspect" && \
                   grep -q 'Platform:.*linux/arm64' <<<"$inspect"; then
                  printf '%s\n' "$inspect"
                  return 0
                fi
              fi
              echo "Registry manifest not ready for $image (attempt ${attempt}/12)" >&2
              if [[ -n "$inspect" ]]; then
                printf '%s\n' "$inspect" >&2
              fi
              sleep $((attempt * 5))
            done
            echo "Unable to verify $image after retries" >&2
            return 1
          }

          ghcr="${IMAGE_GHCR}:${VERSION}"
          dockerhub="${IMAGE_DOCKERHUB}:${VERSION}"
          ghcr_inspect="$(inspect_with_retry "$ghcr")"
          dockerhub_inspect="$(inspect_with_retry "$dockerhub")"
          ghcr_digest="$(awk '/^Digest:/ {print $2; exit}' <<<"$ghcr_inspect")"
          dockerhub_digest="$(awk '/^Digest:/ {print $2; exit}' <<<"$dockerhub_inspect")"
          test -n "$ghcr_digest"
          test "$ghcr_digest" = "$dockerhub_digest" || {
            echo "Registry digest mismatch: GHCR=$ghcr_digest DockerHub=$dockerhub_digest" >&2
            exit 1
          }
          echo "digest=$ghcr_digest" >> "$GITHUB_OUTPUT"

      - name: Attest GHCR build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE_GHCR }}
          subject-digest: ${{ steps.verify.outputs.digest }}
          push-to-registry: true

      - name: Generate release metadata
        shell: bash
        env:
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
          DIGEST: ${{ steps.verify.outputs.digest }}
        run: |
          set -euo pipefail
          cat > release-metadata.txt <<EOF
          tag=${TAG}
          version=${VERSION}
          source_sha=${SOURCE_SHA}
          ghcr=${IMAGE_GHCR}:${VERSION}
          dockerhub=${IMAGE_DOCKERHUB}:${VERSION}
          digest=${DIGEST}
          platforms=linux/amd64,linux/arm64
          sbom=OCI SBOM attestation generated by the original release build
          provenance=GitHub build provenance attestation recovered without moving the immutable tag
          EOF
          cat > release-notes.md <<EOF
          # OSINT Tools ${VERSION}

          Source: ${SOURCE_SHA}

          OCI images:
          - ${IMAGE_GHCR}:${VERSION}@${DIGEST}
          - ${IMAGE_DOCKERHUB}:${VERSION}@${DIGEST}

          Platforms: linux/amd64, linux/arm64.

          Upgrade: stop the application, back up the complete /data state, pull this immutable release, start it, then verify /healthz and /api/v1/info. Do not downgrade a migrated data store without restoring a backup compatible with the older release.

          Persistent data is /data. Provider credentials are deployment secrets and are not included in application-data backups or release artifacts. ClamAV remains optional and external to the application image.

          SBOM was produced by the original release build. Provenance and release metadata were completed by the immutable-tag recovery workflow after registry verification.
          EOF

      - name: Upload release metadata artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-metadata-${{ steps.release.outputs.tag }}
          path: release-metadata.txt
          if-no-files-found: error

      - name: Create or complete GitHub release metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "OSINT Tools ${VERSION}" --notes-file release-notes.md
            gh release upload "$TAG" release-metadata.txt --clobber
          else
            gh release create "$TAG" --verify-tag --title "OSINT Tools ${VERSION}" --notes-file release-notes.md release-metadata.txt
          fi
