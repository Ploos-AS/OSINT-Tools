name: Qualification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qualification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install project and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'

      - name: Install Chromium for M6.2 browser qualification
        run: python -m playwright install --with-deps chromium

      - name: Verify Docker daemon
        run: docker info

      - name: Run canonical qualification
        run: sh scripts/qualify.sh

      - name: M7.2 backup restore upgrade
        run: python scripts/qualification_m72_backup_restore.py

      - name: M7.3 release contract
        run: python scripts/qualification_m73_release.py

      - name: M6.2 browser security
        run: sh scripts/qualification_m62_browser.sh
