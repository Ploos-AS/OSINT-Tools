[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "osint-tools"
version = "0.6.1"
description = "Self-hosted passive-first OSINT workbench"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
    "dnspython>=2.6,<3",
    "Pillow>=11,<13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-playwright>=0.7,<1",
]

[project.scripts]
osint-tools = "osint_tools.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
osint_tools = ["static/*.css", "static/*.js"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
