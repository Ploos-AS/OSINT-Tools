[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "osint-tools"
version = "0.4.5"
description = "Self-hosted passive-first OSINT workbench"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
    "dnspython>=2.6,<3",
    "Pillow>=11,<13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
]

[project.scripts]
osint-tools = "osint_tools.server:main"

[tool.setuptools.packages.find]
where = ["src"]
