services:
  osint-tools:
    build:
      context: .
      dockerfile: Containerfile
    image: osint-tools:dev
    ports:
      - "${OSINT_TOOLS_PORT_PUBLISHED:-8090}:8080"
    volumes:
      - osint-tools-data:/data
    environment:
      IPINFO_TOKEN: "${IPINFO_TOKEN:-}"
      VIRUSTOTAL_API_KEY: "${VIRUSTOTAL_API_KEY:-}"
      ABUSEIPDB_API_KEY: "${ABUSEIPDB_API_KEY:-}"
      SHODAN_API_KEY: "${SHODAN_API_KEY:-}"
      OSINT_TOOLS_MAX_UPLOAD_BYTES: "${OSINT_TOOLS_MAX_UPLOAD_BYTES:-26214400}"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  osint-tools-data:
