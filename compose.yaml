services:
  osint-tools:
    build:
      context: .
      dockerfile: Containerfile
    image: osint-tools:dev
    ports:
      - "${OSINT_TOOLS_PORT_PUBLISHED:-8090}:8080"
    volumes:
      - osint-tools-data:/data
    environment:
      OSINT_TAXII_ENABLED: "${OSINT_TAXII_ENABLED:-false}"
      OSINT_TAXII_URL: "${OSINT_TAXII_URL:-}"
      OSINT_TAXII_TOKEN: "${OSINT_TAXII_TOKEN:-}"
      OSINT_MISP_ENABLED: "${OSINT_MISP_ENABLED:-false}"
      OSINT_MISP_URL: "${OSINT_MISP_URL:-}"
      OSINT_MISP_API_KEY: "${OSINT_MISP_API_KEY:-}"
      IPINFO_TOKEN: "${IPINFO_TOKEN:-}"
      VIRUSTOTAL_API_KEY: "${VIRUSTOTAL_API_KEY:-}"
      ABUSEIPDB_API_KEY: "${ABUSEIPDB_API_KEY:-}"
      SHODAN_API_KEY: "${SHODAN_API_KEY:-}"
      OSINT_TOOLS_MAX_UPLOAD_BYTES: "${OSINT_TOOLS_MAX_UPLOAD_BYTES:-26214400}"
      OSINT_TOOLS_ARCHIVE_MAX_DEPTH: "${OSINT_TOOLS_ARCHIVE_MAX_DEPTH:-3}"
      OSINT_TOOLS_ARCHIVE_MAX_MEMBERS: "${OSINT_TOOLS_ARCHIVE_MAX_MEMBERS:-1000}"
      OSINT_TOOLS_ARCHIVE_MAX_MEMBER_BYTES: "${OSINT_TOOLS_ARCHIVE_MAX_MEMBER_BYTES:-26214400}"
      OSINT_TOOLS_ARCHIVE_MAX_TOTAL_BYTES: "${OSINT_TOOLS_ARCHIVE_MAX_TOTAL_BYTES:-104857600}"
      OSINT_TOOLS_ARCHIVE_MAX_RATIO: "${OSINT_TOOLS_ARCHIVE_MAX_RATIO:-100}"
      OSINT_TOOLS_IMAGE_MAX_PIXELS: "${OSINT_TOOLS_IMAGE_MAX_PIXELS:-40000000}"
      OSINT_TOOLS_BINARY_MAX_SCAN_BYTES: "${OSINT_TOOLS_BINARY_MAX_SCAN_BYTES:-16777216}"
      OSINT_TOOLS_BINARY_MAX_STRINGS: "${OSINT_TOOLS_BINARY_MAX_STRINGS:-2000}"
      OSINT_TOOLS_BINARY_MIN_STRING_LENGTH: "${OSINT_TOOLS_BINARY_MIN_STRING_LENGTH:-4}"
      OSINT_TOOLS_BINARY_MAX_STRING_LENGTH: "${OSINT_TOOLS_BINARY_MAX_STRING_LENGTH:-1024}"
      OSINT_TOOLS_BINARY_MAX_SECTIONS: "${OSINT_TOOLS_BINARY_MAX_SECTIONS:-256}"
      OSINT_TOOLS_BINARY_MAX_SYMBOLS: "${OSINT_TOOLS_BINARY_MAX_SYMBOLS:-2000}"
      OSINT_TOOLS_BINARY_MAX_IMPORTS: "${OSINT_TOOLS_BINARY_MAX_IMPORTS:-1000}"
      OSINT_TOOLS_BINARY_MAX_EXPORTS: "${OSINT_TOOLS_BINARY_MAX_EXPORTS:-1000}"
      OSINT_TOOLS_BINARY_MAX_CANDIDATES: "${OSINT_TOOLS_BINARY_MAX_CANDIDATES:-500}"
      OSINT_TOOLS_YARA_TIMEOUT_SECONDS: "${OSINT_TOOLS_YARA_TIMEOUT_SECONDS:-5}"
      OSINT_TOOLS_YARA_MAX_MATCHES: "${OSINT_TOOLS_YARA_MAX_MATCHES:-100}"
      OSINT_TOOLS_YARA_MAX_STRING_MATCHES: "${OSINT_TOOLS_YARA_MAX_STRING_MATCHES:-100}"
      OSINT_TOOLS_RULE_MAX_BYTES: "${OSINT_TOOLS_RULE_MAX_BYTES:-262144}"
      OSINT_TOOLS_RULEPACK_MAX_BYTES: "${OSINT_TOOLS_RULEPACK_MAX_BYTES:-1048576}"
      OSINT_TOOLS_HASHSET_MAX_BYTES: "${OSINT_TOOLS_HASHSET_MAX_BYTES:-4194304}"
      OSINT_TOOLS_HASHSET_MAX_ENTRIES: "${OSINT_TOOLS_HASHSET_MAX_ENTRIES:-100000}"
      OSINT_TOOLS_SIMILAR_MAX_RESULTS: "${OSINT_TOOLS_SIMILAR_MAX_RESULTS:-100}"
      OSINT_TOOLS_AV_SCAN_ON_UPLOAD: "${OSINT_TOOLS_AV_SCAN_ON_UPLOAD:-false}"
      OSINT_TOOLS_CLAMAV_ENABLED: "${OSINT_TOOLS_CLAMAV_ENABLED:-false}"
      OSINT_TOOLS_CLAMAV_HOST: "${OSINT_TOOLS_CLAMAV_HOST:-clamav}"
      OSINT_TOOLS_CLAMAV_PORT: "${OSINT_TOOLS_CLAMAV_PORT:-3310}"
      OSINT_TOOLS_CLAMAV_TIMEOUT_SECONDS: "${OSINT_TOOLS_CLAMAV_TIMEOUT_SECONDS:-15}"
      OSINT_TOOLS_CLAMAV_MAX_RESPONSE_BYTES: "${OSINT_TOOLS_CLAMAV_MAX_RESPONSE_BYTES:-4096}"
      OSINT_TOOLS_AV_MAX_ENGINES: "${OSINT_TOOLS_AV_MAX_ENGINES:-4}"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    extra_hosts:
      - "host.docker.internal:host-gateway"

  clamav:
    image: clamav/clamav:1.4.3
    profiles: ["av"]
    expose:
      - "3310"
    volumes:
      - clamav-db:/var/lib/clamav
    restart: unless-stopped

volumes:
  osint-tools-data:
  clamav-db:
