services:
  osint-tools:
    build:
      context: .
      dockerfile: Containerfile
    image: osint-tools:dev
    ports:
      - "${OSINT_TOOLS_PORT_PUBLISHED:-8090}:8080"
    volumes:
      - osint-tools-data:/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  osint-tools-data:
